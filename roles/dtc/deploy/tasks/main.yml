---

# Task Router - Dynamically determines which sub_main file to execute
# based on fabric_type and change_flags
- name: Route tasks for fabric type {{ data_model_extended.vxlan.fabric.type }}
  cisco.nac_dc_vxlan.dtc.task_router:
    fabric_type: "{{ data_model_extended.vxlan.fabric.type }}"
    change_flags: "{{ change_flags }}"
    role: "deploy"
    child_fabrics_vrfs_networks_changed: "{{ child_fabrics_vrfs_networks_changed | default([]) }}"
  register: task_router_result
  tags: "{{ nac_tags.deploy }}"

- name: Execute routed tasks for {{ data_model_extended.vxlan.fabric.type }}
  ansible.builtin.include_tasks: "{{ task_file }}"
  loop: "{{ task_router_result.task_files }}"
  loop_control:
    loop_var: task_file
  when: task_router_result.task_files | length > 0
  tags: "{{ nac_tags.deploy }}"

- name: Mark Stage Role Deploy Completed
  cisco.nac_dc_vxlan.common.run_map:
    data_model: "{{ data_model_extended }}"
    stage: role_deploy_completed
  register: run_map
  tags: "{{ nac_tags.deploy }}"
  delegate_to: localhost
