---

- name: Set vars_common Based On Fabric Type - VXLAN_EVPN/iBGP_VXLAN
  ansible.builtin.set_fact:
    vars_common_local: "{{ vars_common_vxlan }}"
  when: data_model_extended.vxlan.fabric.type == "VXLAN_EVPN"

- name: Set vars_common Based On Fabric Type - MSD
  ansible.builtin.set_fact:
    vars_common_local: "{{ vars_common_msd }}"
  when: data_model_extended.vxlan.fabric.type == "MSD"

- name: Set vars_common Based On Fabric Type - External
  ansible.builtin.set_fact:
    vars_common_local: "{{ vars_common_external }}"
  when: data_model_extended.vxlan.fabric.type == "External"

- name: Manage Fabric Entry Point
  ansible.builtin.debug:
    msg:
      - "---------------------------------------------------------------"
      - "+     Manage Fabric {{ data_model_extended.vxlan.fabric.name }}"
      - "---------------------------------------------------------------"

- name: Manage Fabric in Nexus Dashboard
  cisco.dcnm.dcnm_fabric:
    state: merged
    # HOTFIX(sgt_passthrough): when DCNM owns SGT (ENABLE_SGT=loose), dcnm_fabric's
    # client-side validator spuriously rejects ENABLE_PVLAN=false on the MSD. Skip
    # client-side validation for passthrough fabrics (NDFC still validates server-side).
    # Read the MERGED model (data_model_extended): the raw 'vxlan' hostvar is unreliable
    # here because hash_behaviour=replace collapses the split *.nac.yaml files.
    skip_validation: "{{ ( (data_model_extended.vxlan.multisite.sgt_passthrough | default(false)) if data_model_extended.vxlan.fabric.type == 'MSD' else (data_model_extended.vxlan.global.ibgp.sgt_passthrough | default(false)) ) | bool }}"
    config: "{{ vars_common_local.fabric_config }}"

- name: Create ANYCAST_RP in Nexus Dashboard
  cisco.dcnm.dcnm_resource_manager:
    state: merged
    fabric: "{{ data_model_extended.vxlan.fabric.name }}"
    config:
      - entity_name: "ANYCAST_RP"
        pool_type: "IP"
        pool_name: "ANYCAST_RP_IP_POOL"
        scope_type: "fabric"
        resource: "{{ vxlan.underlay.multicast.ipv4.anycast_rp }}"
  when:
    - vxlan.underlay.general.manual_underlay_allocation | default(defaults.vxlan.underlay.general.manual_underlay_allocation)
    - vxlan.underlay.general.replication_mode | default(defaults.vxlan.underlay.general.replication_mode) == "multicast"
